# steamac: prefix drop-in (like app-steam-.scope.d): Steam Frame hardware and SteamOS VR units,
# also ones a SteamOS update renames or adds that masks.d does not list yet, do not run in the
# VM. /run/steamac/slot is written by the steamac initramfs on every VM boot.
[Unit]
ConditionPathExists=!/run/steamac/slot
